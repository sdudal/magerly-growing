name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linting
      run: npm run lint
    
    - name: Check formatting
      run: npm run format:check
    
    - name: Build site
      run: npm run build
    
    - name: Test build output
      run: |
        test -f dist/index.html
        test -f dist/privacy.html
        test -f dist/terms.html
        test -f dist/404.html
        test -f dist/app-ads.txt
        test -f dist/sitemap.xml
        test -f dist/robots.txt
        test -f dist/og-preview.png
        test -f dist/twitter-card.png
        test -f dist/ru/index.html
    
    - name: Validate Infrastructure Templates
      run: |
        if command -v aws &> /dev/null; then
          echo "AWS CLI found, validating CloudFormation templates..."
          chmod +x infrastructure/scripts/deploy.sh
          ./infrastructure/scripts/deploy.sh validate || echo "AWS CLI not configured, skipping template validation"
        else
          echo "AWS CLI not available, skipping infrastructure validation"
        fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build site
      run: npm run build
    
    - name: Deploy to AWS S3
      run: echo "AWS S3 deployment will be configured in Story 1.2"
