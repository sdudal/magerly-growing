<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="100" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="530" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="950" cy="150" r="80" fill="#fbbf24" opacity="0.1"/>
  
  <!-- Content Container -->
  <rect x="80" y="100" width="1040" height="430" rx="20" fill="url(#cardGradient)" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  
  <!-- Icon/Logo -->
  <circle cx="200" cy="250" r="60" fill="#fbbf24"/>
  <text x="200" y="275" font-size="70" font-family="Arial, sans-serif" text-anchor="middle" fill="#1e40af">👶</text>
  
  <!-- Main Text Content -->
  <text x="320" y="220" font-size="72" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff">
    Magerly
  </text>
  
  <text x="320" y="280" font-size="32" font-family="Arial, sans-serif" fill="#e0e7ff" font-weight="500">
    Your Baby's Growth Companion
  </text>
  
  <text x="320" y="340" font-size="24" font-family="Arial, sans-serif" fill="#dbeafe">
    Track milestones • Expert guidance • Celebrate growth
  </text>
  
  <!-- Features Row -->
  <g transform="translate(320, 380)">
    <!-- Feature 1 -->
    <circle cx="15" cy="0" r="12" fill="#10b981"/>
    <text x="35" y="7" font-size="20" font-family="Arial, sans-serif" fill="#ffffff">📊 Growth Tracking</text>
    
    <!-- Feature 2 -->
    <circle cx="260" cy="0" r="12" fill="#10b981"/>
    <text x="280" y="7" font-size="20" font-family="Arial, sans-serif" fill="#ffffff">🎯 Smart Reminders</text>
    
    <!-- Feature 3 -->
    <circle cx="500" cy="0" r="12" fill="#10b981"/>
    <text x="520" y="7" font-size="20" font-family="Arial, sans-serif" fill="#ffffff">👩‍⚕️ Expert Tips</text>
  </g>
  
  <!-- Bottom Badge -->
  <rect x="320" y="450" width="280" height="50" rx="25" fill="#fbbf24"/>
  <text x="460" y="483" font-size="24" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Free Download
  </text>
  
  <!-- Rating -->
  <text x="650" y="483" font-size="20" font-family="Arial, sans-serif" fill="#fbbf24" font-weight="600">
    ⭐⭐⭐⭐⭐ 4.8/5
  </text>
  
  <!-- Small branding at bottom -->
  <text x="1050" y="610" font-size="16" font-family="Arial, sans-serif" fill="#e0e7ff" text-anchor="end">
    magerly.com
  </text>
</svg>

